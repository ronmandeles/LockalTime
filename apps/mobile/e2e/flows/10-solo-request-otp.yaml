appId: com.lockaltime.app
---
# Golden path 2/2, flow 1 of 2: "create -> emergency exit". Single account,
# single device — no join/second-account choreography needed here.
- launchApp:
    clearState: true
# The welcome screen is a single page whose CTA is the only way forward —
# the old 'onboarding-skip' link no longer exists. `optional: true` means a
# stale id here would NOT error, it would silently no-op and leave the app
# sitting on onboarding until an unrelated assertion failed further down.
- tapOn:
    id: 'onboarding-primary-cta'
    optional: true
- tapOn:
    id: 'permission-allow-cta'
    optional: true
- tapOn:
    id: 'permission-proceed-anyway'
    optional: true
- assertVisible:
    id: 'auth-screen'
- tapOn:
    id: 'auth-email-input'
- inputText: '${TEST_SOLO_EMAIL}'
- tapOn:
    id: 'auth-email-continue-cta'
- assertVisible:
    id: 'auth-code-input'
