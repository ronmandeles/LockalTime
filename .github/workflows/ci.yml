name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Phase 7: lets a feature branch trigger a manual run (e.g. to verify the
  # ios-build job) without needing a PR into main first.
  workflow_dispatch: {}

# Cancel superseded runs on the same ref — keeps the queue clear during
# autonomous runs that push once per closed task.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: server (lint, typecheck, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24 = active LTS line, matches local dev (v24.18.x).
          node-version: 24
          cache: npm
          # apps/server is an npm workspace of the ROOT lockfile.
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint --workspace apps/server
      - run: npm run typecheck --workspace apps/server
      - run: npm test --workspace apps/server

  mobile:
    name: mobile (lint, typecheck, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        # apps/mobile is intentionally OUTSIDE the npm workspaces — it has its
        # own lockfile and node_modules (React Native tooling requirement).
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  db:
    name: db (supabase boot + pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      # Installs the supabase CLI pinned by the root lockfile, so CI runs the
      # exact same CLI version as local dev (see supabase root devDependency).
      - run: npm ci
      # Boot what the pgTAP suite and the email-OTP integration test need;
      # Mailpit stays up because the integration test reads the OTP email
      # from its HTTP API.
      # realtime stays in (unlike the other excluded services): the mobile
      # session-channel integration test needs it (Postgres Changes +
      # Broadcast, task 2.5).
      - run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,storage-api
      - run: npx supabase test db
      # Real create -> join -> leave, RLS, and concurrent-join-at-capacity
      # checks against the stack just booted (apps/server is a root
      # workspace, already installed by the npm ci above).
      - run: npm run test:integration --workspace apps/server
      # Real email-OTP signup flow against the stack just booted (request ->
      # Mailpit -> verify -> trigger-created profile row). apps/mobile owns
      # its own lockfile outside the workspaces; uncached install keeps this
      # job simple.
      - run: npm ci
        working-directory: apps/mobile
      - run: npm run test:integration
        working-directory: apps/mobile

  android-build:
    name: android (assembleDebug — compiles the native project)
    # Nothing in CI compiled Android until this job existed. That left a real
    # blind spot rather than a theoretical one: the `mobile` job runs Jest,
    # which can assert that an Android resource FILE contains certain text but
    # never that the project actually builds — so a bad `@color/...`
    # reference, a malformed styles.xml, or a Kotlin error in the blocker
    # module would reach a device untouched by CI. The black+navy theme change
    # edited styles.xml and added colors.xml with exactly that exposure.
    #
    # assembleDebug, not assembleRelease: debug signs with the checked-in
    # debug keystore, so this job needs no secrets. Release signing is covered
    # by the runbook in docs/DEPLOYMENT.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      # The React Native Gradle Plugin reads node_modules, so JS deps must be
      # installed before Gradle runs even though nothing here executes JS.
      - run: npm ci
        working-directory: apps/mobile
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # React Native 0.86's Gradle plugin requires JDK 17+.
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      # One ABI, not the three in gradle.properties: this job exists to prove
      # the project COMPILES and its resources link, and that answer is
      # identical per-ABI while the build is ~3x cheaper. Multi-ABI output is
      # a packaging concern, and packaging is the release build's job.
      - name: assembleDebug (arm64-v8a only)
        run: ./gradlew assembleDebug -PreactNativeArchitectures=arm64-v8a --no-daemon
        working-directory: apps/mobile/android

  ios-build:
    name: ios (macOS CI — first real xcodebuild compile)
    # Phase 7 (Release Prep): the Swift blocker code
    # (apps/mobile/ios/LockalTime/Blocking/, LockalTimeBlockerExtension/)
    # has existed since Phase 3 task 3.6 but was never compiled — no Mac
    # available locally (CLAUDE.md's standing constraint). This job does
    # the one-time Xcode project wiring docs/MANUAL_QA.md documents for a
    # human to do by hand, scripted instead
    # (ios/scripts/wire-blocking-target.rb via the xcodeproj gem), then
    # builds for the Simulator with code signing disabled — this job
    # verifies the Swift actually COMPILES and LINKS, not that it's ready
    # for a signed device/App Store build (that needs the real Family
    # Controls entitlement approval + a distribution cert, both still
    # owner-actioned per docs/MANUAL_QA.md).
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - name: Install xcodeproj gem
        run: gem install xcodeproj --no-document
      - name: Wire the Blocking/ target + LockalTimeBlockerExtension into project.pbxproj
        run: ruby scripts/wire-blocking-target.rb
        working-directory: apps/mobile/ios
      - name: pod install
        run: pod install --repo-update
        working-directory: apps/mobile/ios
      - name: xcodebuild (Simulator, unsigned)
        run: |
          xcodebuild build \
            -workspace LockalTime.xcworkspace \
            -scheme LockalTime \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
        working-directory: apps/mobile/ios
