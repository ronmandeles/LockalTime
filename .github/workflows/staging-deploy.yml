name: Staging Deploy

# Phase 7 (Release Prep): deploys apps/server to the Railway staging
# environment and pushes migrations to the LockalTime-staging Supabase
# project — never production (docs/DEPLOYMENT.md's staging runbook).
# Manual trigger, or automatic on a push to any release/* branch (the
# branching convention this repo uses for a release candidate).
on:
  push:
    branches: ['release/**']
  workflow_dispatch: {}

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  test:
    name: full suite (gate before any deploy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint --workspace apps/server
      - run: npm run typecheck --workspace apps/server
      - run: npm test --workspace apps/server

  migrate-staging:
    name: push migrations to LockalTime-staging
    needs: test
    runs-on: ubuntu-latest
    # Owner-actioned prerequisite (docs/DEPLOYMENT.md): these secrets must
    # exist in the repo (Settings -> Secrets and variables -> Actions)
    # before this job can do anything real. Until then it fails loudly
    # here rather than silently deploying nothing.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Link staging project
        run: npx supabase link --project-ref "${{ secrets.STAGING_SUPABASE_PROJECT_REF }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Push migrations
        run: npx supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Verify service_role grants landed
        run: npx supabase db execute --linked --file scripts/verify-service-role-grants.sql
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  deploy-railway:
    name: deploy apps/server to Railway staging
    needs: migrate-staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Deploy
        run: railway up --service apps-server --environment staging --detach
        working-directory: apps/server
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
